[project]
name = "orbit-weather-flask"
version = "0.1.0"
description = "Live TLE weather-satellite tracker with ground-track and observer sky-view plots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "numpy>=2.1,<3",
    "plotly>=6,<7",
    "requests>=2.32,<3",
    "skyfield>=1.53,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

